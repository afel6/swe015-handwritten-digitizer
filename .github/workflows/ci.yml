name: ci

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}${{ matrix.assets && ' / with assets' || '' }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      # Some hosted Windows runners advertise CPU features that fault inside oneDNN's dynamic INT8 kernels
      # (exit 0xc000001d, illegal instruction); capping oneDNN at AVX2 avoids those code paths.
      ONEDNN_MAX_CPU_ISA: ${{ startsWith(matrix.os, 'windows') && 'AVX2' || '' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13"]
        assets: [false]
        include:
          - os: ubuntu-latest
            python: "3.13"
            assets: true
          - os: windows-latest
            python: "3.13"
            assets: true
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install (exactly as the README says)
        run: |
          python -m pip install torch==2.9.1 torchvision==0.24.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
      - name: Download public assets
        if: ${{ matrix.assets }}
        run: python scripts/download_assets.py
      - name: Tests
        run: python -m pytest -q -rs
      - name: Verify claims
        run: python verify.py
